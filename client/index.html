<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AATOS Intelligence - Terminal</title>
    <style>
        :root {
            --bg: #0e0e10;
            --panel: #141417;
            --text: #e8e6e3;
            --dim: #8b8b90;
            --accent: #d97757;
            --green: #8bd49c;
            --red: #e06c75;
            --border: #2a2a2e;
            --mono: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.65;
            display: flex;
            justify-content: center;
        }

        #app {
            width: 100%;
            max-width: 860px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 22px 22px 0;
        }

        .banner {
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            margin-bottom: 12px;
        }
        .banner h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.14em;
            margin: 0 0 2px;
        }
        .banner .sub {
            color: var(--dim);
            font-size: 12px;
            letter-spacing: 0.06em;
        }
        .banner .meta {
            margin-top: 8px;
            font-size: 12px;
            color: var(--dim);
        }
        .banner .dot { color: var(--green); }
        .banner .accent { color: var(--accent); }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 6px 2px 18px;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-thumb { background: #232327; border-radius: 4px; }

        .msg {
            margin: 0 0 16px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg .prompt { color: var(--accent); }
        .msg.ai .label {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 2px;
        }
        .msg.ai .body { white-space: pre-wrap; }
        .msg.system { color: var(--dim); }
        .msg.error { color: var(--red); }

        .cursor {
            display: inline-block;
            width: 0.6ch;
            background: var(--accent);
            color: transparent;
            animation: blink 1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        #input-form {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            padding: 10px 12px;
            margin-bottom: 16px;
        }
        #input-form:focus-within { border-color: var(--accent); }
        #input-form .prompt {
            color: var(--accent);
            font-size: 13px;
            white-space: nowrap;
        }
        #cmd {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
        }
        #cmd::placeholder { color: #5c5c62; }

        #lock-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(14, 14, 16, 0.96);
            backdrop-filter: blur(6px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #lock-screen.hidden {
            opacity: 0;
            transform: scale(0.98);
            pointer-events: none;
        }
        .lock-box {
            width: min(360px, 92vw);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            padding: 22px 20px;
            text-align: center;
        }
        .lock-box h2 {
            font-size: 14px;
            letter-spacing: 0.14em;
            margin: 0 0 4px;
            color: var(--accent);
        }
        .lock-box p {
            margin: 0 0 16px;
            color: var(--dim);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .captcha-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }
        #captcha-canvas {
            display: block;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #0a0a0c;
        }
        #captcha-refresh {
            position: absolute;
            top: -9px;
            right: -9px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--dim);
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }
        #captcha-refresh:hover { color: var(--accent); border-color: var(--accent); }
        .captcha-row { display: flex; gap: 8px; align-items: center; }
        #captcha-input {
            flex: 1;
            min-width: 0;
            background: #0a0a0c;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            padding: 9px 10px;
            outline: none;
            text-align: center;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        #captcha-input:focus { border-color: var(--accent); }
        #captcha-btn {
            background: var(--accent);
            color: #141417;
            border: none;
            border-radius: 5px;
            font-family: var(--mono);
            font-weight: 700;
            padding: 9px 14px;
            cursor: pointer;
        }
        #captcha-btn:hover { filter: brightness(1.1); }
        #captcha-msg {
            margin-top: 10px;
            min-height: 14px;
            font-size: 11px;
            letter-spacing: 0.06em;
            color: var(--red);
        }
        .hp {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        @media (max-width: 600px) {
            #app { padding: 14px 14px 0; }
            body { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="lock-screen">
        <div class="lock-box">
            <h2>AATOS CORE LOCK</h2>
            <p>Human verification required</p>
            <div class="captcha-wrap">
                <canvas id="captcha-canvas" width="220" height="64"></canvas>
                <button id="captcha-refresh" type="button" title="New challenge">&#8635;</button>
            </div>
            <div class="captcha-row">
                <input id="captcha-input" type="text" maxlength="6" autocomplete="off" spellcheck="false" placeholder="CODE" />
                <button id="captcha-btn" type="button">ENTER</button>
            </div>
            <div id="captcha-msg"></div>
            <input class="hp" id="captcha-hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
        </div>
    </div>

    <div id="app">
        <div class="banner">
            <h1>AATOS INTELLIGENCE</h1>
            <div class="sub">Orbital Intelligence Terminal &middot; v2.6</div>
            <div class="meta"><span class="dot">&#9679;</span> Node online &nbsp; model: <span class="accent" id="model-label">openai/gpt-oss-120b</span></div>
            <div class="meta">Type /help for commands</div>
        </div>

        <div id="chat"></div>

        <form id="input-form" autocomplete="off">
            <span class="prompt">+- Commander &gt;</span>
            <input id="cmd" type="text" spellcheck="false" placeholder="Ask AATOS anything..." />
        </form>
    </div>

    <script>
        (function () {
            var API_BASE = window.AATOS_API_BASE || (
                (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '')
                    ? 'http://localhost:5000'
                    : 'https://open-claw-backend.onrender.com'
            );

            var TOKEN = '2005';
            var MODEL = 'openai/gpt-oss-120b';

            var chatEl = document.getElementById('chat');
            var form = document.getElementById('input-form');
            var input = document.getElementById('cmd');
            var lock = document.getElementById('lock-screen');

            var captchaCanvas = document.getElementById('captcha-canvas');
            var captchaInput = document.getElementById('captcha-input');
            var captchaMsg = document.getElementById('captcha-msg');
            var captchaHp = document.getElementById('captcha-hp');
            var captchaCode = '';

            var history = [];

            var HELP = [
                '/help          show this help',
                '/clear         clear the screen',
                '/model         show current model',
                '/reset         clear conversation memory',
                '/exit          close the terminal'
            ].join('\n');

            function scrollBottom() {
                chatEl.scrollTop = chatEl.scrollHeight;
            }

            function make(tag, cls, text) {
                var n = document.createElement(tag);
                if (cls) n.className = cls;
                if (text !== undefined) n.textContent = text;
                return n;
            }

            function addUser(text) {
                var row = make('div', 'msg user');
                row.appendChild(make('span', 'prompt', '+- Commander > '));
                row.appendChild(make('span', 'text', text));
                chatEl.appendChild(row);
                scrollBottom();
            }

            function addSystem(text, isError) {
                chatEl.appendChild(make('div', isError ? 'msg error' : 'msg system', text));
                scrollBottom();
            }

            function addAI() {
                var row = make('div', 'msg ai');
                row.appendChild(make('div', 'label', '* AATOS'));
                var body = make('div', 'body');
                var thinking = make('span', '', 'thinking...');
                thinking.style.color = 'var(--dim)';
                body.appendChild(thinking);
                row.appendChild(body);
                chatEl.appendChild(row);
                scrollBottom();
                return body;
            }

            function typeOut(target, text) {
                target.textContent = '';
                var cursor = make('span', 'cursor', '\u258c');
                var node = document.createTextNode('');
                target.appendChild(node);
                target.appendChild(cursor);
                var i = 0;
                var timer = setInterval(function () {
                    i = Math.min(text.length, i + 4);
                    node.data = text.slice(0, i);
                    scrollBottom();
                    if (i >= text.length) {
                        clearInterval(timer);
                        cursor.remove();
                    }
                }, 12);
            }

            function send(text) {
                var prior = history.slice(-20);
                addUser(text);
                history.push({ role: 'user', content: text });
                var body = addAI();

                fetch(API_BASE + '/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: text, token: TOKEN, history: prior })
                })
                    .then(function (res) { return res.json().catch(function () { return {}; }); })
                    .then(function (data) {
                        var reply = data.feedback || data.error || 'No response from core node.';
                        if (data.feedback) history.push({ role: 'assistant', content: reply });
                        typeOut(body, reply);
                    })
                    .catch(function (err) {
                        typeOut(body, 'System Core Error: ' + err.message);
                    });
            }

            function runCommand(text) {
                var parts = text.slice(1).trim().split(/\s+/);
                var cmd = (parts.shift() || '').toLowerCase();
                switch (cmd) {
                    case 'help': addSystem(HELP); break;
                    case 'clear': chatEl.innerHTML = ''; break;
                    case 'reset':
                        history = [];
                        chatEl.innerHTML = '';
                        addSystem('conversation memory cleared');
                        break;
                    case 'model': addSystem('model: ' + MODEL + ' (server-side)'); break;
                    case 'exit': addSystem('AATOS stays online in the browser. Close the tab to exit.'); break;
                    default: addSystem('unknown command /' + cmd + ' - try /help', true);
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var text = input.value.trim();
                if (!text) return;
                input.value = '';
                if (text.charAt(0) === '/') runCommand(text);
                else send(text);
            });

            function generateCaptcha() {
                var ctx = captchaCanvas.getContext('2d');
                var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                var code = '';
                for (var i = 0; i < 5; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                captchaCode = code;

                ctx.clearRect(0, 0, captchaCanvas.width, captchaCanvas.height);
                ctx.fillStyle = '#0a0a0c';
                ctx.fillRect(0, 0, captchaCanvas.width, captchaCanvas.height);

                for (var l = 0; l < 6; l++) {
                    ctx.strokeStyle = 'rgba(217,119,87,' + (0.08 + Math.random() * 0.2) + ')';
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height);
                    ctx.lineTo(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height);
                    ctx.stroke();
                }

                for (var d = 0; d < 90; d++) {
                    ctx.fillStyle = 'rgba(232,230,227,' + (Math.random() * 0.18) + ')';
                    ctx.fillRect(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height, 1.5, 1.5);
                }

                var family = getComputedStyle(document.body).fontFamily;
                for (var c = 0; c < code.length; c++) {
                    ctx.save();
                    ctx.font = 'bold 28px ' + family;
                    ctx.fillStyle = '#d97757';
                    ctx.translate(18 + c * 36, 40 + (Math.random() * 6 - 3));
                    ctx.rotate((Math.random() - 0.5) * 0.25);
                    ctx.fillText(code.charAt(c), 0, 0);
                    ctx.restore();
                }

                captchaInput.value = '';
            }

            function failCaptcha(msg) {
                captchaMsg.textContent = msg;
                generateCaptcha();
                captchaInput.focus();
            }

            function verifyCaptcha() {
                if (captchaHp.value.trim() !== '') return failCaptcha('BOT DETECTED');
                var value = captchaInput.value.trim().toUpperCase();
                if (!value) return;
                if (value === captchaCode) {
                    captchaMsg.textContent = '';
                    lock.classList.add('hidden');
                    setTimeout(function () {
                        lock.style.display = 'none';
                        input.focus();
                    }, 420);
                } else {
                    failCaptcha('INVALID CODE. TRY AGAIN.');
                }
            }

            document.getElementById('captcha-btn').addEventListener('click', verifyCaptcha);
            document.getElementById('captcha-refresh').addEventListener('click', generateCaptcha);
            captchaInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    verifyCaptcha();
                }
            });

            generateCaptcha();
        })();
    </script>
</body>
</html>
